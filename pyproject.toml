[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qwbot"
version = "0.2.0"
description = "External QuakeWorld bot controller with optional telemetry and navigation learning"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
qwbot = "qwbot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
